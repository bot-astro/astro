version: v1.0
name: Main pipeline

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version java 25

blocks:
  # bot
  - name: Build, test and push astro bot
    dependencies: []
    run:
      when: |
        branch = 'master' and change_in(['/services/bot/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
    task:
      secrets:
        - name: github
        - name: sentry
      prologue:
        commands:
          - cache restore gradle-caches_bot
          - cache restore gradle-wrapper_bot
          - checkout
      jobs:
        - name: Build, test and push bot
          commands:
            - ./gradlew :services:bot:build
            - ./gradlew :services:bot:jib -Djib.httpTimeout=60000
      epilogue:
        on_pass:
          commands:
            - cache delete gradle-caches_bot
            - cache delete gradle-wrapper_bot
            - cache store gradle-caches_bot ~/.gradle/caches
            - cache store gradle-wrapper_bot ~/.gradle/wrapper

  # api-central
  - name: Build, test and push api-central
    dependencies: []
    run:
      when: |
        branch = 'master' and change_in(['/services/api-central/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
    task:
      secrets:
        - name: github
        - name: sentry
      prologue:
        commands:
          - cache restore gradle-caches_api-central
          - cache restore gradle-wrapper_api-central
          - checkout
      jobs:
        - name: Build, test and push api-central
          commands:
            - ./gradlew :services:api-central:build
            - ./gradlew :services:api-central:jib -Djib.httpTimeout=60000
      epilogue:
        on_pass:
          commands:
            - cache delete gradle-caches_api-central
            - cache delete gradle-wrapper_api-central
            - cache store gradle-caches_api-central ~/.gradle/caches
            - cache store gradle-wrapper_api-central ~/.gradle/wrapper

  # support-bot
  - name: Build, test and push support bot
    dependencies: []
    run:
      when: |
        branch = 'master' and change_in(['/services/support-bot/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
    task:
      secrets:
        - name: github
        - name: sentry
      prologue:
        commands:
          - cache restore gradle-caches_support-bot
          - cache restore gradle-wrapper_support-bot
          - checkout
      jobs:
        - name: Build, test and push support-bot
          commands:
            - ./gradlew :services:support-bot:build
            - ./gradlew :services:support-bot:jib -Djib.httpTimeout=60000
      epilogue:
        on_pass:
          commands:
            - cache delete gradle-caches_support-bot
            - cache delete gradle-wrapper_support-bot
            - cache store gradle-caches_support-bot ~/.gradle/caches
            - cache store gradle-wrapper_support-bot ~/.gradle/wrapper

  # entitlements-expiration-job
  - name: Build, test and push entitlements-expiration-job
