promotions:
  # bot
  - name: Deploy bot to staging
    pipeline_file: deploy/bot/staging.yml
    auto_promote:
      when: |
        result = 'passed' and branch = 'master' and change_in(['/services/bot/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
  - name: Deploy bot to production
    pipeline_file: deploy/bot/production.yml

  # api-central
  - name: Deploy api-central to staging
    pipeline_file: deploy/api-central/staging.yml
    auto_promote:
      when: |
        result = 'passed' and branch = 'master' and change_in(['/services/api-central/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
  - name: Deploy api-central to production
    pipeline_file: deploy/api-central/production.yml

  # support-bot
  - name: Deploy support-bot to staging
    pipeline_file: deploy/support-bot/staging.yml
