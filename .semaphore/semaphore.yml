      when: |
        result = 'passed' and branch = 'master' and change_in(['/services/support-bot/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
