        branch = 'master' and change_in(['/services/entitlements-expiration-job/', '/shared/', '/build.gradle.kts', '/settings.gradle.kts', '/.semaphore/', '/gradle/libs.versions.toml', '/build-logic/'], { branch_range: '$SEMAPHORE_GIT_COMMIT_RANGE' })
    task:
