default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        entry: ./gradlew --console=plain ktlintFormat
        language: system
        pass_filenames: false
        files: \.(kt|kts)$
        stages: [pre-commit]
      - id: detekt
        name: detekt
        entry: ./gradlew --console=plain detekt
        language: system
        pass_filenames: false
        files: \.(kt|kts)$
        stages: [pre-push]
