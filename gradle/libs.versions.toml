[versions]
# Build tooling
jib = "3.5.4"
ksp = "2.3.3"
ktlint = "14.2.0"
detekt = "2.0.0-alpha.6"

# Kotlin
kotlin = "2.4.0"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"

# Core
guava = "33.6.0-jre"
nanoid = "2.0.0"
datetime = "0.7.1"
nettyDns = "4.2.17.Final"
icu4j = "68.1"

# Spring
springDependencyManagementPlugin = "1.1.7"
springBootPlugin = "4.1.0"
springdoc = "3.1.0"

# Logging and monitoring
sentryPlugin = "6.24.0"
kotlin-logging = "8.0.4"
logback = "1.6.1"

# Data
mongo = "5.9.1"
s3 = "1.9.4"

# Serialization
jackson-date = "2.22.1"

# Concurrency
coroutines = "1.10.2"

# Security
jjwt = "0.13.0"
bucket4j = "8.21.0"

# Caching
lettuce = "7.6.0.RELEASE"

# Integrations
chargebee = "4.14.0"
jda = "6.5.0"
jda-ktx = "0.15.0"

# Analytics
bigquery = "2.69.0"

# Testing
junit = "6.1.2"

[libraries]
# BUILD PLUGINS
kotlin-jvm-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { group = "org.jetbrains.kotlin.plugin.serialization", name = "org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
kotlin-spring-plugin = { module = "org.jetbrains.kotlin.plugin.spring:org.jetbrains.kotlin.plugin.spring.gradle.plugin", version.ref = "kotlin" }
spring-boot-plugin = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "springBootPlugin" }
spring-dependency-management-plugin = { module = "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin", version.ref = "springDependencyManagementPlugin" }
jib-plugin = { module = "com.google.cloud.tools.jib:com.google.cloud.tools.jib.gradle.plugin", version.ref = "jib" }
ktlint-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
detekt-plugin = { module = "dev.detekt:dev.detekt.gradle.plugin", version.ref = "detekt" }
sentry-plugin = { module = "io.sentry.jvm.gradle:io.sentry.jvm.gradle.gradle.plugin", version.ref = "sentryPlugin" }

# PLATFORM BOMS
mongo-bom = { module = "org.mongodb:mongodb-driver-bom", version.ref = "mongo" }

# DEPENDENCIES

# Core
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
nanoid = { module = "com.aventrix.jnanoid:jnanoid", version.ref = "nanoid" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
netty-resolver-dsn = { module = "io.netty:netty-resolver-dns-native-macos", version.ref = "nettyDns"}
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
icu4j-charset = { module = "com.ibm.icu:icu4j-charset", version.ref = "icu4j" }
icu4j-localespi = { module = "com.ibm.icu:icu4j-localespi", version.ref = "icu4j" }

# Spring
spring-core = { module = "org.springframework:spring-core" }
spring-context = { module = "org.springframework:spring-context" }
spring-boot = { module = "org.springframework.boot:spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis"}
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
springdoc-openapi-starter-webmvc-scalar = { module = "org.springdoc:springdoc-openapi-starter-webmvc-scalar", version.ref = "springdoc" }

# Logging and monitoring
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback = { module = "ch.qos.logback:logback-classic" }

# Data
s3 = { module = "aws.sdk.kotlin:s3", version.ref = "s3" }

# Serialization
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }

# Concurrency
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "coroutines" }

# Security
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
bucket4j-redis-common = { module = "com.bucket4j:bucket4j_jdk17-redis-common", version.ref = "bucket4j" }
bucket4j-lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4j" }

# Caching
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# Integrations
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
jda-ktx = { module = "club.minnced:jda-ktx", version.ref = "jda-ktx" }
chargebee = { module = "com.chargebee:chargebee-java", version.ref = "chargebee" }

# Analytics
bigquery = { module = "com.google.cloud:google-cloud-bigquery", version.ref = "bigquery" }

# Testing
junit = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }

[bundles]
service-core=[
    "netty-resolver-dsn",
    "spring-boot-starter",
    "spring-boot-starter-actuator",
    "spring-boot-starter-opentelemetry"
]
serialization=[
    "jackson-kotlin"
]
coroutines=[
    "coroutines-core",
    "coroutines-reactor"
]
logging=[
    "kotlin-logging",
    "logback"
]
cache=[
    "spring-boot-starter-data-redis"
]
db=[
    "kotlin-reflect",
    "spring-boot-starter-data-mongodb"
]
web=[
    "spring-boot-starter-webmvc",
    "spring-boot-starter-security",
    "springdoc-openapi-starter-webmvc-scalar",
    "jjwt-api",
    "jjwt-impl",
    "jjwt-jackson"
]
icu4j = [
    "icu4j",
    "icu4j-charset",
    "icu4j-localespi"
]
bucket4j = [
    "bucket4j",
    "bucket4j-redis-common",
    "bucket4j-lettuce"
]