info:
  app:
    name: "Entitlements expiration job"
    description: "Job that removes the expired entitlements from the guilds."

logging:
  level:
    root: ${EEJ__LOG_LEVEL}

spring:
  main:
    web-application-type: none
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      client-name: entitlements-expiration-job
      client-type: lettuce
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      password: ${REDIS_PASSWORD:}

sentry:
  dsn: https://16d5963ef1bc772e7881083afe2807d8@o4506708022263808.ingest.us.sentry.io/4506708023967744
  environment: ${EEJ__SENTRY_ENVIRONMENT:local}
  logs:
    enabled: true
  # Set traces-sample-rate to 1.0 to capture 100% of transactions for performance monitoring.
  # We recommend adjusting this value in production.
  traces-sample-rate: 0.05
  data-collection:
    user-info: false
#####################
# CUSTOM PROPERTIES #
#####################

discord:
  api:
    base-url: ${DISCORD_API_BASE_URL}
    enabled: true
  application:
    id: ${EEJ__DISCORD_APPLICATION_ID}
    token: ${EEJ__DISCORD_APPLICATION_TOKEN}
