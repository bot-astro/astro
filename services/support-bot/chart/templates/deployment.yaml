apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        random: '0'
    spec:
      nodeSelector:
        gport.giuliopime.dev/agent: "as-cruiser"
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image.group }}/{{ .Values.image.name }}:{{ .Values.image.tag }}
        ports:
          - name: metrics
            containerPort: {{ .Values.port }}
        envFrom:
          - configMapRef:
              name: {{ .Values.config }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.port }}
            httpHeaders:
              - name: Authorization
                value: {{ .Values.auth }}
          timeoutSeconds: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.port }}
            httpHeaders:
              - name: Authorization
                value: {{ .Values.auth }}
          timeoutSeconds: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 10
      imagePullSecrets:
      - name: docker-registry
      terminationGracePeriodSeconds: 30
  serviceName: {{ .Values.name }}
  podManagementPolicy: Parallel
